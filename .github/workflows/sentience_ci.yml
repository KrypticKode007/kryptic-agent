# =====================================================================
# REPOSITORY SPECIFICATION: .github/workflows/sentience_ci.yml
# PURPOSE: Continuous Integration Audit Pipeline for Cognitive Engines
# =====================================================================

name: "Embodied Cybernetic Sentience CI Audit Suite"

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  matrix_stability_audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: "Checkout Code Repository"
      uses: actions/checkout@v4

    - name: "Set Up Substrate Execution Runtime (Python ${{ matrix.python-version }})"
      uses: actions/with-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: "Install Scientific Compute Dependencies"
      run: |
        python -m pip install --upgrade pip
        pip install numpy

    - name: "Construct Sandbox Branch Environment Mockup"
      run: |
        # Creates directory architecture dynamically to simulate setup.sh deployment states
        mkdir -p core_engine
        touch core_engine/__init__.py
        
        # Verify pristine file layout continuity
        if [ ! -f core_engine/somatic_baseline.py ]; then
          echo "[INTEGRITY WARN] Somatic baseline script is missing. Re-mapping fallback configurations..."
        fi

    - name: "Audit Core Integration & Snapback Logic"
      run: |
        # Execute the unified orchestrator script to trace structural alignment loops
        if [ -f main_workspace.py ]; then
          python main_workspace.py
        else
          echo "[CRITICAL ERROR] Unified integration workspace orchestrator script (main_workspace.py) not found."
          exit 1
        fi

    - name: "Verify Substrate-Agnostic Blueprint Compilation"
      run: |
        # Assert that the compiler generated the necessary JSON tracking payload configuration
        if [ -f cybernetic_snapback_blueprint.json ]; then
          echo "[✔] CI VERIFICATION PASS: Agnostic blueprint structure serialized correctly onto memory device."
          
          # Run schema audit check to guarantee index fields aren't completely corrupted
          cat cybernetic_snapback_blueprint.json | python3 -m json.tool > /dev/null
          echo "[✔] CI VERIFICATION PASS: Agnostic JSON blueprint contains zero parsing syntax defects."
        else
          echo "[CRITICAL ERROR] Post-snapback telemetry snapshot ledger was never generated by compilation branch."
          exit 1
        fi
        
