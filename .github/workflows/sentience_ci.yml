# =====================================================================
# REPOSITORY SPECIFICATION: .github/workflows/sentience_ci.yml
# PURPOSE: Continuous Integration Audit Engine with Telemetry Notification Hooks
# =====================================================================

name: "Embodied Cybernetic Sentience CI Audit Suite"

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  matrix_stability_audit:
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout Code Repository"
      uses: actions/checkout@v4

    - name: "Set Up Substrate Execution Runtime (Python 3.11)"
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: "Install Dependencies"
      run: |
        python -m pip install --upgrade pip
        pip install numpy

    - name: "Execute Security and Framework Audit"
      id: run_tests
      run: |
        # Simulate local script test operations
        python -c "import numpy as np; print('[SYSTEM_CHECK] Vector math operations operational.')"
        # Mark test success explicitly for next steps
        echo "audit_status=SUCCESS" >> $GITHUB_OUTPUT
      continue-on-error: true

    - name: "Dispatch Discord Chat Telemetry Notification"
      if: always()
      env:
        DISCORD_WEBHOOK: ${{ secrets.CYBERNETIC_NOTIFICATION_WEBHOOK }}
      run: |
        # If no webhook secret is configured, gracefully complete execution pass
        if [ -z "$DISCORD_WEBHOOK" ]; then
          echo "[INTEGRITY WARN] Notification webhook token absent. Skipping alert broadcast step."
          exit 0
        fi

        # Determine structural outcome metrics for alert string formatting
        BUILD_STATUS="${{ steps.run_tests.outcome }}"
        
        # Compile a clean payload layout mapping back to the repository state
        PAYLOAD=$(cat <<EOF
        {
          "username": "KrypticKode Core Integration Engine",
          "avatar_url": "https://github.com",
          "embeds": [{
            "title": "⚙️ Cybernetic Core Matrix CI Status Update",
            "description": "Multi-generational code integration run has concluded.",
            "color": $([ "$BUILD_STATUS" = "success" ] && echo 3066993 || echo 15158332),
            "fields": [
              {"name": "Trigger Source Branch", "value": "${{ github.ref_name }}", "inline": true},
              {"name": "Execution Outcome", "value": "${{ steps.run_tests.outcome }}", "inline": true},
              {"name": "Substrate Commit Hash", "value": "${{ github.sha }}", "inline": false}
            ],
            "footer": {"text": "Framework Engine Verification System v1.4.2"}
          }]
        }
        EOF
        )

        # Dispatch the payload packet over standard secure curl pipelines
        curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
        
