name: Kryptic-Agent CI Engine

on:
  push:
    branches: [ main, dev-hardware-integration, commercial ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake sqlite3 libsqlite3-dev

    - name: Install Python Package Infrastructure
      run: |
        python -m pip install --upgrade pip
        pip install pytest fastapi uvicorn requests cryptography

    - name: Compile High-Speed Native Matrix Accelerator Binary
      run: |
        g++ -O3 -std=c++17 -Wall -Wextra -Werror kryptic_hardware_accelerator.cpp -o matrix_accelerator
        chmod +x matrix_accelerator

    - name: Execute Cybernetic Validation Testing Matrix
      run: |
        pytest tests -v
