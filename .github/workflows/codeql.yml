- name: Autobuild
  uses: github/codeql-action/autobuild@v3
  # 1. Remove or comment out the default autobuilder:
# - name: Autobuild
#   uses: github/codeql-action/autobuild@v3

# 2. Add your explicit, step-by-step build routine:
- name: Install dependencies and Build
  run: |
    # Example for CMake (change these to your project's actual build commands)
    mkdir build
    cd build
    cmake ..
    make -j$(nproc)
    
