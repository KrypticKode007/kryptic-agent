version: '3.8'

services:
  kryptic_edge_agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: running-kryptic-node
    ports:
      - "8000:8000"
    volumes:
      - kryptic_persistence_volume:/app/data
    environment:
      - PERSISTENCE_DB_PATH=/app/data/kryptic_agent_persistence.db
    restart: unless-stopped

volumes:
  kryptic_persistence_volume:
    driver: local
    
