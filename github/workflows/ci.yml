name: CI Build and Test

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-with-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile Hardware Accelerator
      env:
        REPOS_DIR: ${{ github.workspace }}
      run: |
        # Use workspace relative pathing to ensure cc1plus resolves the source file
        g++ -O3 -shared -std=c++17 -fPIC \
          -I${{ github.workspace }}/include \
          ${{ github.workspace }}/src/kryptic_hardware_accelerator.cpp \
          -o ${{ github.workspace }}/libkryptic_accel.so
          
