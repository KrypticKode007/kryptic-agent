# .github/workflows/kryptic-integration-ci.yml
name: "Embodied Cybernetic Sentience CI Audit Suite"

on:
  push:
    branches:
      - 'main'
      - 'feature/ascendant-core-integration'
  pull_request:
    branches:
      - 'main'
      - 'feature/ascendant-core-integration'

jobs:
  audit-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: "Checkout Codebase"
        uses: actions/checkout@v4

      - name: "Setup Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: "Install Structural Linting Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest

      - name: "Sanitize Indentation and Block Syntax (Ruff/Black)"
        run: |
          # Ensure there are no unbalanced text blocks or syntax layout discrepancies
          black --check --diff .
          ruff check .

      - name: "Execute Hard Boundary & IM-FIN Test Suite"
        run: |
          # Verify zero structural entropy and homeostatic loop compliance
          if [ -f tests/test_integration_core.py ]; then
            pytest tests/test_integration_core.py -v
          else
            python kryptic_integration_core.py
          fi

      - name: "Audit Cryptographic SWMP & History Storage"
        run: |
          # Ensure SQLite retention databases handle microsecond boots cleanly
          python -c "
          import sqlite3, hmac, hashlib
          conn = sqlite3.connect(':memory:')
          print('SQLite Core Integrity: PASS')
          "
          
